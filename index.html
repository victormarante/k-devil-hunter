<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K Devil Hunter – Character Info &amp; Damage Tool</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── Header ──────────────────────────────────────────────────────── -->
      <header class="site-header">
        <h1>K <span>Devil</span> Hunter</h1>
        <p>Character Info &amp; Damage Calculator</p>
      </header>

      <!-- ── Main Layout ─────────────────────────────────────────────────── -->
      <main class="main-layout">

        <!-- ── Attacker column ──────────────────────────────────────────── -->
        <div class="panel">
          <h2 class="panel-title">⚔️ Attacker – Select Character</h2>
          <div class="char-roster" id="attacker-roster"></div>
        </div>

        <!-- ── Defender column ──────────────────────────────────────────── -->
        <div class="panel">
          <h2 class="panel-title">🛡️ Defender – Select Character</h2>
          <div class="char-roster" id="defender-roster"></div>
        </div>

        <!-- ── Attacker stats ────────────────────────────────────────────── -->
        <div class="panel">
          <h2 class="panel-title">Attacker Stats</h2>
          <div class="level-control">
            <label for="attacker-level">Level</label>
            <input
              type="range"
              id="attacker-level"
              min="1"
              max="100"
              value="1"
            />
            <span class="level-display" id="attacker-level-display">1</span>
          </div>
          <div id="attacker-info">
            <p class="placeholder">Select a character above</p>
          </div>
        </div>

        <!-- ── Defender stats ────────────────────────────────────────────── -->
        <div class="panel">
          <h2 class="panel-title">Defender Stats</h2>
          <div class="level-control">
            <label for="defender-level">Level</label>
            <input
              type="range"
              id="defender-level"
              min="1"
              max="100"
              value="1"
            />
            <span class="level-display" id="defender-level-display">1</span>
          </div>
          <div id="defender-info">
            <p class="placeholder">Select a character above</p>
          </div>
        </div>

        <!-- ── Damage Calculator ─────────────────────────────────────────── -->
        <div class="panel calculator-panel">
          <h2 class="panel-title">💥 Damage Calculator</h2>

          <div class="calculator-controls">
            <label for="skill-multiplier">Skill Multiplier</label>
            <input
              type="number"
              id="skill-multiplier"
              min="0.1"
              max="10"
              step="0.1"
              value="1.0"
              style="width: 80px"
            />

            <button class="btn" id="roll-damage-btn">🎲 Roll Hit</button>
          </div>

          <div id="damage-result">
            <p class="placeholder">
              Select both an attacker and a defender to see damage estimates.
            </p>
          </div>

          <div id="roll-result" class="roll-result" style="display:none"></div>
        </div>

      </main>
    </div>

    <!-- Scripts (order matters: data → logic → app) -->
    <script src="js/characters.js"></script>
    <script src="js/damage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
